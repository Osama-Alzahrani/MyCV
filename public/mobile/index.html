<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Osama | Portfolio</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              display: ['Space Grotesk', 'sans-serif'],
            },
            colors: {
              accent: '#22d3ee',
              dark: '#050505',
              glass: 'rgba(20, 20, 20, 0.5)',
            },
            animation: {
              'blob':        'blob 10s infinite',
              'float':       'float 6s ease-in-out infinite',
              'bounce-slow': 'bounce 3s infinite',
              'scroll':      'scroll 25s linear infinite',
            },
            keyframes: {
              blob: {
                '0%, 100%': { transform: 'translate(0,0) scale(1)' },
                '33%':      { transform: 'translate(30px,-50px) scale(1.1)' },
                '66%':      { transform: 'translate(-20px,20px) scale(0.9)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%':      { transform: 'translateY(-14px)' },
              },
              scroll: {
                '0%':   { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
            }
          }
        }
      }
    </script>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      @keyframes shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position:  200% 0; }
      }
      .sk {
        background: linear-gradient(90deg,
          rgba(255,255,255,0.04) 25%,
          rgba(255,255,255,0.11) 50%,
          rgba(255,255,255,0.04) 75%
        ) !important;
        background-size: 200% 100% !important;
        animation: shimmer 1.4s ease-in-out infinite;
        color: transparent !important;
        -webkit-text-fill-color: transparent !important;
        border-color: transparent !important;
        border-radius: 8px;
        pointer-events: none;
        user-select: none;
      }

      /* Scroll dot pill */
      .dot { width: 5px; height: 5px; border-radius: 99px; background: rgba(255,255,255,0.2); transition: height .3s ease, background .3s ease; }
      .dot-active { height: 20px; background: #22d3ee; }
    </style>
  </head>

  <body class="bg-dark text-white overflow-hidden antialiased selection:bg-accent selection:text-black">

    <!-- Background -->
    <div class="fixed inset-0 z-[-2] bg-[radial-gradient(circle_at_50%_30%,_#0d1117_0%,_#000000_100%)]"></div>
    <div class="fixed top-[-15%] left-[-15%] w-[60vw] h-[60vw] bg-indigo-700 rounded-full blur-[120px] opacity-30 animate-blob mix-blend-screen z-[-1]"></div>
    <div class="fixed bottom-[-15%] right-[-15%] w-[60vw] h-[60vw] bg-cyan-700 rounded-full blur-[120px] opacity-30 animate-blob z-[-1]" style="animation-delay:3s"></div>

    <!-- Nav -->
    <nav class="fixed top-0 left-0 w-full z-50 px-4 pt-4">
      <div class="flex justify-between items-center bg-white/5 backdrop-blur-2xl border border-white/8 rounded-2xl px-5 py-3 shadow-xl">
        <a href="#" class="font-display font-bold text-[5vw] tracking-tight">Osama<span class="text-accent">.dev</span></a>
        <a id="nav-contact" href="#" class="bg-accent/10 border border-accent/30 text-accent rounded-xl px-4 py-2 text-[3.5vw] font-semibold active:scale-95 transition-transform">Contact</a>
      </div>
    </nav>

    <!-- Scroll dots -->
    <div id="scroll-dots" class="fixed right-3 top-1/2 -translate-y-1/2 z-50 flex flex-col items-center gap-[6px]"></div>

    <main id="main-scroll" class="h-screen w-full snap-y snap-mandatory overflow-y-scroll no-scrollbar">

      <!-- ── Hero ── -->
      <section id="sec-home" class="h-screen w-full snap-start snap-always flex flex-col justify-center items-center relative px-6 overflow-hidden" style="padding-top:16vh;padding-bottom:28vh">

        <!-- Profile image -->
        <div class="relative mb-6 animate-float" style="width:58vw;height:58vw;max-width:230px;max-height:230px">
          <div class="absolute inset-0 rounded-full border-2 border-white/15"></div>
          <div class="absolute inset-0 rounded-full border-2 border-accent/40 blur-[3px]"></div>
          <div class="absolute inset-[-8px] rounded-full border border-accent/10"></div>
          <img id="hero-profile-img" src="../innerWebsite/media/images/CV/profile.webp"
               class="w-full h-full object-cover rounded-full"
               style="box-shadow:0 0 40px rgba(34,211,238,0.15)" alt="Profile">
          <div id="hero-profile-skeleton" class="sk absolute inset-0 rounded-full"></div>
        </div>

        <!-- Name -->
        <h1 class="font-display font-bold leading-[0.92] text-center tracking-tight animate-on-scroll" style="font-size:10vw">
          <span id="hero-name-first" class="sk">Osama</span><br>
          <span id="hero-name-last" class="sk" style="background:linear-gradient(135deg,#22d3ee,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Al-Zahrani</span>
        </h1>

        <!-- Bio -->
        <p id="hero-bio" class="sk mt-4 text-white/55 text-center animate-on-scroll leading-relaxed px-4"
           style="font-size:3.6vw;max-width:80vw">
          Junior software developer with a solid foundation in computer science.
        </p>

        <!-- Tech icon scroll strip -->
        <div class="absolute w-full overflow-hidden whitespace-nowrap opacity-40" style="bottom:17vh">
          <div class="inline-flex animate-scroll gap-10">
            <div class="flex gap-10 mx-5">
              <i class="devicon-python-plain" style="font-size:8vw"></i>
              <i class="devicon-cplusplus-plain" style="font-size:8vw"></i>
              <i class="devicon-java-plain" style="font-size:8vw"></i>
              <i class="devicon-javascript-plain" style="font-size:8vw"></i>
              <i class="devicon-html5-plain" style="font-size:8vw"></i>
              <i class="devicon-css3-plain" style="font-size:8vw"></i>
              <i class="devicon-mysql-plain" style="font-size:8vw"></i>
              <i class="devicon-rails-plain" style="font-size:8vw"></i>
              <i class="devicon-dart-plain" style="font-size:8vw"></i>
              <i class="devicon-flutter-plain" style="font-size:8vw"></i>
              <i class="devicon-react-original" style="font-size:8vw"></i>
              <i class="devicon-vuejs-plain" style="font-size:8vw"></i>
              <i class="devicon-django-plain" style="font-size:8vw"></i>
            </div>
            <div class="flex gap-10 mx-5">
              <i class="devicon-python-plain" style="font-size:8vw"></i>
              <i class="devicon-cplusplus-plain" style="font-size:8vw"></i>
              <i class="devicon-java-plain" style="font-size:8vw"></i>
              <i class="devicon-javascript-plain" style="font-size:8vw"></i>
              <i class="devicon-html5-plain" style="font-size:8vw"></i>
              <i class="devicon-css3-plain" style="font-size:8vw"></i>
              <i class="devicon-mysql-plain" style="font-size:8vw"></i>
              <i class="devicon-rails-plain" style="font-size:8vw"></i>
              <i class="devicon-dart-plain" style="font-size:8vw"></i>
              <i class="devicon-flutter-plain" style="font-size:8vw"></i>
              <i class="devicon-react-original" style="font-size:8vw"></i>
              <i class="devicon-vuejs-plain" style="font-size:8vw"></i>
              <i class="devicon-django-plain" style="font-size:8vw"></i>
            </div>
          </div>
        </div>

        <!-- Swipe hint -->
        <div class="absolute flex flex-col items-center gap-1 opacity-35 animate-bounce-slow" style="bottom:10vh">
          <span style="font-size:2.8vw;letter-spacing:0.15em" class="text-white/60 uppercase">Swipe</span>
          <i class="fa-solid fa-chevron-down" style="font-size:4vw"></i>
        </div>
      </section>

      <!-- ── Projects injected by JS ── -->
      <div id="projects-container"></div>

      <!-- ── Education ── -->
      <section id="sec-education" class="h-screen w-full snap-start snap-always flex flex-col justify-between items-center px-5 relative overflow-hidden" style="padding-top:14vh;padding-bottom:calc(70px + env(safe-area-inset-bottom,0px) + 2vh)">

        <div class="w-full animate-on-scroll">
          <p class="text-accent uppercase tracking-[0.3em] mb-3" style="font-size:2.8vw">Background</p>
          <h2 class="font-display font-bold mb-8" style="font-size:9vw">Education</h2>

          <div class="bg-white/4 border border-white/8 rounded-2xl p-6 space-y-4">
            <div class="flex items-start gap-4">
              <div class="w-10 h-10 rounded-xl bg-accent/10 border border-accent/20 flex items-center justify-center flex-shrink-0 mt-1">
                <i class="fa-solid fa-graduation-cap text-accent" style="font-size:4vw"></i>
              </div>
              <div>
                <div id="edu-degree" class="sk font-bold text-white" style="font-size:5vw">Computer Science</div>
                <div id="edu-university" class="sk text-white/50 mt-1" style="font-size:3.5vw">Qassim University</div>
              </div>
            </div>
            <div class="border-t border-white/6 pt-4">
              <span id="edu-gpa" class="sk inline-flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/25 text-emerald-400 rounded-xl px-4 py-2 font-semibold" style="font-size:3.5vw">
                GPA: Excellent
              </span>
            </div>
          </div>
        </div>


      </section>

    </main>

    <!-- Tab bar -->
    <div class="fixed bottom-0 left-0 right-0 z-50"
         style="background:rgba(4,4,4,0.88);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-top:1px solid rgba(255,255,255,0.07);padding:10px 0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))">
      <div class="flex justify-around items-center">

        <a id="social-github" href="#" target="_blank"
           class="flex flex-col items-center gap-[5px] active:opacity-50 transition-opacity"
           style="min-width:20vw">
          <i class="fa-brands fa-github text-white/65" style="font-size:6vw"></i>
          <span class="text-white/35 uppercase tracking-widest" style="font-size:2.2vw">GitHub</span>
        </a>

        <div style="width:1px;height:28px;background:rgba(255,255,255,0.07)"></div>

        <a id="social-linkedin" href="#" target="_blank"
           class="flex flex-col items-center gap-[5px] active:opacity-50 transition-opacity"
           style="min-width:20vw">
          <i class="fa-brands fa-linkedin-in text-white/65" style="font-size:6vw"></i>
          <span class="text-white/35 uppercase tracking-widest" style="font-size:2.2vw">LinkedIn</span>
        </a>

        <div style="width:1px;height:28px;background:rgba(255,255,255,0.07)"></div>

        <a id="social-email" href="#"
           class="flex flex-col items-center gap-[5px] active:opacity-50 transition-opacity"
           style="min-width:20vw">
          <i class="fa-solid fa-envelope text-white/65" style="font-size:6vw"></i>
          <span class="text-white/35 uppercase tracking-widest" style="font-size:2.2vw">Email</span>
        </a>

        <div style="width:1px;height:28px;background:rgba(255,255,255,0.07)"></div>

        <button id="load-3d-btn" onclick="load3D()"
           class="flex flex-col items-center gap-[5px] active:opacity-50 transition-opacity"
           style="min-width:20vw;background:none;border:none;cursor:pointer;padding:0">
          <i class="fa-solid fa-cube" style="font-size:6vw;color:#22d3ee"></i>
          <span style="font-size:2.2vw;color:#22d3ee;text-transform:uppercase;letter-spacing:0.15em">3D</span>
        </button>

      </div>
    </div>

    <script>
      /* ── Intersection observer for scroll-in animations ── */
      const animObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.remove('opacity-0', 'translate-y-8', 'scale-95');
            entry.target.classList.add('opacity-100', 'translate-y-0', 'scale-100');
          } else {
            entry.target.classList.add('opacity-0', 'translate-y-8', 'scale-95');
            entry.target.classList.remove('opacity-100', 'translate-y-0', 'scale-100');
          }
        });
      }, { threshold: 0.15 });

      function observeAnimatedEls() {
        document.querySelectorAll('.animate-on-scroll:not([data-observed])').forEach(el => {
          el.dataset.observed = '1';
          el.classList.add('transition-all', 'duration-500', 'ease-out', 'opacity-0', 'translate-y-8', 'scale-95');
          animObserver.observe(el);
        });
      }

      /* ── Scroll dot navigator ── */
      function setupScrollDots() {
        const scroller = document.getElementById('main-scroll');
        const sections = scroller.querySelectorAll('section');
        const dotsEl   = document.getElementById('scroll-dots');

        dotsEl.innerHTML = Array.from(sections).map((_, i) =>
          `<div class="dot${i === 0 ? ' dot-active' : ''}"></div>`
        ).join('');

        const dots = dotsEl.querySelectorAll('.dot');

        const dotObserver = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            const idx = Array.from(sections).indexOf(entry.target);
            dots.forEach((d, i) => d.classList.toggle('dot-active', i === idx));
          });
        }, { root: scroller, threshold: 0.5 });

        sections.forEach(s => dotObserver.observe(s));
      }

      /* ── Data helpers ── */
      function bytesToImageUrl(bytesObj) {
        const bytes = new Uint8Array(Object.values(bytesObj));
        return URL.createObjectURL(new Blob([bytes], { type: 'image/png' }));
      }

      async function fetchCV(id = 1) {
        const res = await fetch(`/backendApi/cv/${id}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      }

      /* ── Section builders ── */
      function buildProjectSection(project, index) {
        const num      = String(index + 1).padStart(2, '0');
        const hasImage = project.previewImage && Object.keys(project.previewImage).length > 0;
        const imgHtml  = hasImage
          ? `<img src="${bytesToImageUrl(project.previewImage)}" class="w-full h-full object-cover" alt="${project.title}">`
          : `<div class="w-full h-full flex items-center justify-center" style="background:linear-gradient(135deg,#0f172a,#020617)">
               <i class="fa-solid fa-code text-white/8" style="font-size:20vw"></i>
             </div>`;

        const tags = project.technologies.split(',').slice(0, 3).map(t =>
          `<span class="bg-white/8 border border-white/12 rounded-lg px-3 py-1 text-white/70" style="font-size:3vw">${t.trim()}</span>`
        ).join('');

        const linkBtn = project.projectUrl
          ? `<a href="${project.projectUrl}" target="_blank"
               class="ml-auto flex items-center gap-2 bg-accent/10 border border-accent/30 text-accent rounded-xl px-4 py-2 font-semibold active:scale-95 transition-transform"
               style="font-size:3vw">
               View <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:2.5vw"></i>
             </a>`
          : '';

        return `
          <section class="h-screen w-full snap-start snap-always flex flex-col justify-center items-center px-4 relative">
            <div class="w-full animate-on-scroll" style="height:78vh;background:rgba(14,14,14,0.6);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.07);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.5)">

              <!-- Image -->
              <div style="height:42%;position:relative;flex-shrink:0">
                ${imgHtml}
                <div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(14,14,14,0.95))"></div>
                <div style="position:absolute;bottom:12px;left:16px">
                  <span class="text-white/40 font-bold uppercase tracking-[0.3em]" style="font-size:2.5vw">Project ${num}</span>
                </div>
              </div>

              <!-- Content -->
              <div style="flex:1;padding:20px 20px 16px;display:flex;flex-direction:column;justify-content:space-between">
                <div>
                  <h2 class="font-display font-bold text-white leading-tight mb-2" style="font-size:7.5vw">${project.title}</h2>
                  <p class="text-white/50 leading-relaxed line-clamp-2" style="font-size:3.5vw">${project.description}</p>
                </div>
                <div>
                  <div class="flex flex-wrap gap-2 mb-3">${tags}</div>
                  <div class="flex items-center gap-2">
                    <span class="text-white/25" style="font-size:3vw">${project.year}</span>
                    ${linkBtn}
                  </div>
                </div>
              </div>

            </div>
          </section>`;
      }

      function buildGithubSection(githubUrl) {
        return `
          <section class="h-screen w-full snap-start snap-always flex flex-col justify-center items-center px-4 relative">
            <div class="w-full animate-on-scroll" style="height:78vh;background:rgba(14,14,14,0.6);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.07);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,0.5)">

              <div style="height:42%;position:relative;flex-shrink:0;background:linear-gradient(135deg,#0d1117,#161b22);display:flex;align-items:center;justify-content:center;overflow:hidden">
                <i class="fa-brands fa-github text-white/4 rotate-12 absolute" style="font-size:55vw;right:-10vw"></i>
                <i class="fa-brands fa-github text-white animate-float" style="font-size:18vw;position:relative;z-index:1"></i>
                <div style="position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(14,14,14,0.95))"></div>
              </div>

              <div style="flex:1;padding:20px 20px 16px;display:flex;flex-direction:column;justify-content:space-between">
                <div>
                  <p class="text-accent uppercase tracking-[0.3em] mb-2" style="font-size:2.8vw">The Archive</p>
                  <h2 class="font-display font-bold text-white leading-tight mb-3" style="font-size:7.5vw">More on GitHub</h2>
                  <p class="text-white/45 leading-relaxed" style="font-size:3.5vw">Explore the rest of my work — source code, experimental projects, and open source contributions.</p>
                </div>
                <a href="${githubUrl}" target="_blank"
                   class="flex items-center justify-center gap-3 bg-white text-black font-bold rounded-2xl active:scale-95 transition-transform"
                   style="padding:14px;font-size:4vw">
                  Visit Profile <i class="fa-solid fa-arrow-right"></i>
                </a>
              </div>

            </div>
          </section>`;
      }

      function buildSkeletonSection() {
        return `
          <section class="h-screen w-full snap-start snap-always flex flex-col justify-center items-center px-4 relative">
            <div style="width:100%;height:78vh;background:rgba(14,14,14,0.5);border:1px solid rgba(255,255,255,0.07);border-radius:28px;overflow:hidden;display:flex;flex-direction:column">
              <div class="sk" style="height:42%;border-radius:0"></div>
              <div style="flex:1;padding:20px;display:flex;flex-direction:column;justify-content:space-between;gap:12px">
                <div style="display:flex;flex-direction:column;gap:10px">
                  <div class="sk" style="height:10px;width:25%;border-radius:6px"></div>
                  <div class="sk" style="height:32px;width:70%;border-radius:8px"></div>
                  <div class="sk" style="height:14px;width:100%;border-radius:6px"></div>
                  <div class="sk" style="height:14px;width:85%;border-radius:6px"></div>
                </div>
                <div style="display:flex;gap:8px">
                  <div class="sk" style="height:28px;width:80px;border-radius:8px"></div>
                  <div class="sk" style="height:28px;width:60px;border-radius:8px"></div>
                </div>
              </div>
            </div>
          </section>`;
      }

      /* ── Init ── */
      document.getElementById('projects-container').innerHTML = buildSkeletonSection();

      async function populateMobile() {
        try {
          const data = await fetchCV(1);

          // Hero
          const parts = data.name.trim().split(' ');
          document.getElementById('hero-name-first').textContent = parts[0] || '';
          document.getElementById('hero-name-last').textContent  = parts.slice(1).join(' ') || '';
          document.getElementById('hero-bio').textContent = data.bio;

          if (data.profileImage && Object.keys(data.profileImage).length > 0)
            document.getElementById('hero-profile-img').src = bytesToImageUrl(data.profileImage);

          // Projects
          document.getElementById('projects-container').innerHTML =
            data.projects.map((p, i) => buildProjectSection(p, i)).join('') +
            buildGithubSection(data.github);

          // Education
          document.getElementById('edu-degree').textContent    = data.educationDegree;
          document.getElementById('edu-university').textContent = data.educationUniversity;
          document.getElementById('edu-gpa').textContent        = `GPA: ${data.educationGpa}`;

          // Links
          const mailto = `mailto:${data.email}`;
          document.getElementById('nav-contact').href    = mailto;
          document.getElementById('contact-email').href  = mailto;
          document.getElementById('social-email').href   = mailto;
          document.getElementById('social-github').href  = data.github;
          document.getElementById('social-linkedin').href = data.linkedin;

        } catch (err) {
          console.error('Failed to load CV data:', err);
        } finally {
          document.querySelectorAll('.sk').forEach(el => el.classList.remove('sk'));
          document.getElementById('hero-profile-skeleton')?.remove();
          observeAnimatedEls();
          setupScrollDots();
        }
      }

      populateMobile();

      function load3D() {
        sessionStorage.setItem('force3d', '1');
        window.top.location.href = '/';
      }
    </script>
  </body>
</html>
